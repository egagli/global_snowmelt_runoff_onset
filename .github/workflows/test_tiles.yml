# THROWAWAY workflow for v10 shakedown: run a hand-picked set of tiles on
# GitHub Actions runners against the production icechunk store. Delete once
# the first real batches are running.
#
# Prereqs: the v10 store must already be initialized on Azure
# (processing/create_icechunk_store.ipynb), and the repo secrets
# AZURE_STORAGE_SAS_TOKEN / AZURE_STORAGE_ACCOUNT must hold a current token.
#
# The default tile set mirrors the local validation battery, plus the
# scene-densest tile as the definitive 16 GB-runner memory check. Rows are on the
# EXTENDED v10 grid (2026-07-30: +2 tile rows in the north), i.e. every row index
# here is the v9-era index + 2 -- see processing/README.md "Grid extension":
#   10,0    antimeridian (westernmost columns must contain data)   [v9 8,0]
#   9,138   densest S1 coverage (~594 scenes/yr; peak-memory acid test)  [v9 7,138]
#   25,39   Rainier reference tile (v9 cross-check)                [v9 23,39]
#   28,65   data + no_valid_pixels empty years                     [v9 26,65]
#   25,190  v9 said "no S1", 2026 catalog has data (backfill case)  [v9 23,190]
#   80,240  no_seasonal_snow empty years + 2 data years            [v9 78,240]
#   56,69   equator-straddling tile, Volcán Cayambe north flank    [v9 54,69]
#           (row 56 overhangs lat 0 by exactly 2 px (~160 m): exercises the
#           remove_equator_crossing sliver mask + the bilinear MODIS
#           v8/v9 phenology seam — the only place on Earth where
#           seasonal snow touches the equator)
#   57,69   Cayambe south flank, southern-hemisphere conventions   [v9 55,69]
# Running them concurrently also exercises icechunk's ConflictDetector with
# real concurrent commits to Azure — something local testing cannot cover.

name: TEST tiles (throwaway)

on:
  workflow_dispatch:
    inputs:
      tiles:
        description: "Tiles as 'row,col;row,col;...'"
        required: false
        default: '10,0;9,138;25,39;28,65;25,190;80,240;56,69;57,69'
        type: string
      water_years:
        description: "Water years: 'all' (recomputes + supersedes committed years!), 'missing' (resume: only uncommitted years), 'none' (composites only), or e.g. '2019,2020'"
        required: false
        default: 'missing'
        type: string
      config_file:
        description: 'Config file to use'
        required: false
        default: 'global_config_v10.txt'
        type: string
      dask_workers:
        description: 'Dask workers per job (empty = all runner cores)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
  AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
  # cap glibc malloc arenas: the per-year compute loop otherwise accumulates
  # per-thread arena fragmentation (~1GB/several years measured locally),
  # which matters on long dense-tile jobs
  MALLOC_ARENA_MAX: "2"

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      tiles: ${{ steps.parse.outputs.tiles }}
    steps:
      - name: Parse tile list into matrix
        id: parse
        shell: bash
        run: |
          python3 - "${{ inputs.tiles }}" <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sys
          tiles = []
          for part in sys.argv[1].split(";"):
              part = part.strip()
              if not part:
                  continue
              row, col = (int(x) for x in part.split(","))
              tiles.append({"row": row, "col": col})
          assert tiles, "no tiles parsed"
          print(f"tiles={json.dumps(tiles)}")
          EOF

  test-tile:
    needs: matrix-setup
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        tile: ${{ fromJSON(needs.matrix-setup.outputs.tiles) }}
    name: tile-r${{ matrix.tile.row }}-c${{ matrix.tile.col }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.8.0
      with:
        pixi-version: v0.65.0
        environments: ci
        cache: true

    - name: Process tile
      shell: bash
      run: |
        EXTRA=()
        if [ -n "${{ inputs.dask_workers }}" ]; then
          EXTRA+=(--dask-workers "${{ inputs.dask_workers }}")
        fi
        pixi run -e ci python processing/scripts/process_single_tile.py \
          --tile-row ${{ matrix.tile.row }} \
          --tile-col ${{ matrix.tile.col }} \
          --water-years "${{ inputs.water_years }}" \
          --config-file ${{ inputs.config_file }} \
          "${EXTRA[@]}"
