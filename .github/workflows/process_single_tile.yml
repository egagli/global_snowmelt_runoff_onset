name: Process Single Tile

on:
  workflow_dispatch:
    inputs:
      tile_row:
        description: 'Tile row coordinate (0-99)'
        required: true
        type: number
      tile_col:
        description: 'Tile column coordinate (0-244)'
        required: true
        type: number
      water_years:
        description: "Water years: 'all', 'none' (composites only), or e.g. '2019,2020'"
        required: false
        default: 'all'
        type: string
      config_file:
        description: 'Config file to use'
        required: false
        default: 'global_config_v10.txt'
        type: string

permissions:
  contents: read

env:
  AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
  AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
  # cap glibc malloc arenas: the per-year compute loop otherwise accumulates
  # per-thread arena fragmentation (~1GB/several years measured locally),
  # which matters on long dense-tile jobs
  MALLOC_ARENA_MAX: "2"

jobs:
  process-tile:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    name: tile-r${{ inputs.tile_row }}-c${{ inputs.tile_col }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.8.0
      with:
        pixi-version: v0.65.0
        environments: ci
        cache: true

    - name: Process tile
      shell: bash
      run: |
        pixi run -e ci python processing/scripts/process_single_tile.py \
          --tile-row ${{ inputs.tile_row }} \
          --tile-col ${{ inputs.tile_col }} \
          --water-years "${{ inputs.water_years }}" \
          --config-file ${{ inputs.config_file }} \
          --dask-workers auto
